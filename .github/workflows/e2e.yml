name: E2E

on:
  push:
    branches: [master, main, v3.0.0-pre]
  pull_request:
    branches: [master, main, v3.0.0-pre]

permissions:
  contents: read

jobs:
  e2e:
    name: Lab isolation E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only the lab under test is built, on demand by start-lab
      PREBUILD_LABS_ON_STARTUP: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test client
        run: pip install requests==2.28.2

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for web
        run: |
          for i in $(seq 1 120); do
            curl -sf -o /dev/null http://lvh.me:8000/register && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run E2E tests
        run: PYGOAT_E2E=1 python -m unittest discover -s e2e -v

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop stack
        if: always()
        run: |
          docker ps -aq --filter name=^pglab- | xargs -r docker rm -f
          docker compose down
